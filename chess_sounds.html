<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaos Chess</title>
<meta name="description" content="Chess with dragons, ghosts, cannons, hooks and treasure chests. Play vs bot or local multiplayer.">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edee;--fg:#1b2427;--mut:#58696f;--btn:#d1dadc;--bw:min(96vw,680px,80vh);--sq:calc(var(--bw)/10);--lt:#a9c2bb;--dk:#5f8883;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b1e;--fg:#e6ecee;--mut:#8b9ba1;--btn:#2a3236}}
:root[data-theme="dark"]{--bg:#171b1e;--fg:#e6ecee;--mut:#8b9ba1;--btn:#2a3236}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:400 16px/1.4 "Prompt",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 24px}
h1{margin:0;font-size:22px;font-weight:600}
#st{min-height:24px;font-weight:600;text-align:center}
.cp{width:var(--bw);min-height:30px;display:flex;flex-wrap:wrap;align-items:center;gap:0;color:var(--mut);font-size:13px}
.cp span.l{margin-right:8px}
.cp .pcw{display:inline-flex;align-items:flex-end;justify-content:center;width:22px;height:30px;position:relative}
.wrap{position:relative;width:var(--bw)}
#board{display:grid;grid-template-columns:repeat(10,1fr);width:var(--bw);border-radius:6px;overflow:hidden;box-shadow:0 0 0 5px var(--dk),0 8px 24px #0004;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sq{position:relative;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--sq)*.09);cursor:pointer;box-sizing:border-box}
.l{background-color:var(--lt)}.d{background-color:var(--dk)}
:root[data-bt="1"]{--lt:#ececec;--dk:#3b3b3f}
:root[data-bt="2"]{--lt:#f0d9b5;--dk:#b58863}
:root[data-bt="3"]{--lt:#c8ccd2;--dk:#767c86}
:where(:root[data-bt="2"]) .l{background-image:repeating-linear-gradient(92deg,#0000 0 7px,#8a5a2b14 7px 8px,#0000 8px 15px,#8a5a2b0c 15px 17px)}
:where(:root[data-bt="2"]) .d{background-image:repeating-linear-gradient(88deg,#0000 0 6px,#3a1d0a1c 6px 7px,#0000 7px 14px,#3a1d0a12 14px 16px)}
:where(:root[data-bt="3"]) .l{background-image:radial-gradient(circle at 20% 25%,#ffffff55 0 6%,#0000 7%),radial-gradient(circle at 72% 68%,#00000018 0 8%,#0000 9%),radial-gradient(circle at 55% 15%,#00000012 0 4%,#0000 5%)}
:where(:root[data-bt="3"]) .d{background-image:radial-gradient(circle at 30% 70%,#ffffff2a 0 7%,#0000 8%),radial-gradient(circle at 75% 30%,#00000030 0 8%,#0000 9%),radial-gradient(circle at 15% 20%,#00000022 0 4%,#0000 5%)}
.last{background-image:linear-gradient(#f2c84b88,#f2c84b88)}
.sel{box-shadow:inset 0 0 0 4px #f2c84b}
.chk{background-image:radial-gradient(circle,#e5484dcc 25%,transparent 75%)}
.mov::after{content:"";position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:#1b242744}
.cap{box-shadow:inset 0 0 0 4px #e5484dcc}
.sq img{display:block;pointer-events:none;filter:drop-shadow(0 2px 2px #0006)}
.bpawn{pointer-events:none;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transform:translateY(10%);filter:drop-shadow(0 2px 2px #0006)}
.sq i{position:absolute;font:600 10px/1 "Prompt",sans-serif;font-style:normal;color:#0009;pointer-events:none}
.rk{top:3px;left:3px}.fl{bottom:3px;right:4px}
#pr{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;z-index:5}
#pr[hidden]{display:none}
#pr button{background:var(--lt);border:0;border-radius:8px;width:calc(var(--sq)*1.3);height:calc(var(--sq)*1.3);display:flex;align-items:flex-end;justify-content:center;padding:0 0 6px;cursor:pointer}
.tm{margin-left:auto;font:600 15px/1 "Prompt",sans-serif;font-variant-numeric:tabular-nums;background:var(--btn);color:var(--fg);padding:6px 10px;border-radius:6px}
.tm.on{box-shadow:0 0 0 2px #f2c84b}.tm.lo{color:#e5484d}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ctl button{font:600 14px "Prompt",sans-serif;color:var(--fg);background:var(--btn);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.ctl button:focus-visible,#pr button:focus-visible{outline:3px solid #f2c84b;outline-offset:2px}
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sq)*.85);animation:fl .7s ease-out forwards;pointer-events:none;z-index:4}
@keyframes fl{0%{transform:scale(.3);opacity:1}60%{transform:scale(1.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.fx{animation-duration:.01s}}
.hlp{width:var(--bw);margin:0;font-size:13px;color:var(--mut);text-align:center}
#pr{flex-wrap:wrap;align-content:center}.pt{flex-basis:100%;text-align:center;color:#fff;font-size:13px;padding:0 8px}
.hp{position:absolute;top:5%;left:50%;transform:translateX(-50%);display:flex;gap:2px;pointer-events:none;margin:0}
.hp u{display:block;width:calc(var(--sq)*.24);height:max(4px,calc(var(--sq)*.09));border-radius:2px;background:#0007;text-decoration:none}
.hp u.on{background:#3ddc84;box-shadow:0 0 0 1px #0008}.hp u.ye{background:#f5c518;box-shadow:0 0 0 1px #0008}.hp u.lo{background:#e5484d;box-shadow:0 0 0 1px #0008}
#pr button{position:relative}
.sq.dk::before{content:"";position:absolute;inset:0;background:#04070bd9;z-index:1;pointer-events:none}
.sq i{z-index:2}.mov::after{z-index:3}
#du{position:absolute;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:6px;z-index:6;color:#fff;text-align:center}
#du[hidden]{display:none}
.dt{font-weight:600;font-size:16px;padding:0 10px}.dv{display:flex;align-items:flex-end;gap:14px;height:60px;font-weight:600}.dv .pcw,.dv>b{position:relative}
.bar{position:relative;width:80%;height:28px;border-radius:14px;background:#ffffff26;overflow:hidden}
.bar .z{position:absolute;top:0;bottom:0;background:#3ddc84aa;border:2px solid #3ddc84;box-sizing:border-box;border-radius:10px}
.bar .cur{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 8px #fff}
#dtap{font:600 20px "Prompt",sans-serif;color:#1b2427;background:#f2c84b;border:0;border-radius:12px;padding:12px 44px;cursor:pointer;touch-action:manipulation}
#dtap:disabled{opacity:.5}
.d2{display:flex;gap:14px}.dtap2{font:600 18px "Prompt",sans-serif;color:#1b2427;background:#f2c84b;border:0;border-radius:12px;padding:14px 22px;cursor:pointer;touch-action:manipulation}.dtap2:disabled{opacity:.5}
.dr{min-height:26px;font-weight:600;font-size:18px}.dr.ok{color:#3ddc84}.dr.no{color:#e5484d}
#board{touch-action:none}
@keyframes shg{0%,100%{filter:drop-shadow(0 0 2px var(--g)) drop-shadow(0 0 4px var(--g))}50%{filter:drop-shadow(0 0 5px var(--g)) drop-shadow(0 0 11px var(--g))}}
.shd{--g:#38e1ff;animation:shg 1.5s ease-in-out infinite}.shd-j{--g:#ffd23a}.shd-g{--g:#ff4d52;animation-duration:.7s}
.gho{opacity:.9;filter:drop-shadow(0 0 5px #9fd8ff);animation:gfl 2.2s ease-in-out infinite}
@keyframes gfl{0%,100%{translate:0 0}50%{translate:0 -6%}}
.bigm{filter:drop-shadow(0 0 4px #ffb300) drop-shadow(0 0 9px #ff7a00)}
#hand{position:absolute;z-index:8;height:calc(var(--sq)*1.15);pointer-events:none;transform:translate(-50%,-50%);transition:opacity .2s,height .22s ease-out}
#hand[hidden]{display:none}
#hand.mv,.fl.mv{transition:left .52s cubic-bezier(.4,0,.2,1),top .52s cubic-bezier(.4,0,.2,1),opacity .2s}
.fl{position:absolute;z-index:7;width:var(--sq);height:var(--sq);display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--sq)*.09);box-sizing:border-box;opacity:.7;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 6px #0006)}
.fl img{filter:none}
.sq.gh img,.sq.gh .bpawn,.sq.gh .hp{opacity:.3}
.sh{position:absolute;z-index:9;pointer-events:none;font-size:calc(var(--sq)*.5);transform:translate(-50%,-50%);transition-property:left,top;transition-timing-function:ease-in;filter:drop-shadow(0 3px 3px #0008)}
.flg{font-size:56px;line-height:1.2;text-align:center;padding:6px 0;transition:transform .12s}.flg.go{transform:scale(1.25)}
.chs{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);height:calc(var(--sq)*.6);width:auto;opacity:.95;z-index:0}
.chs.w{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 2px 2px #0006)}.chs.b{filter:drop-shadow(0 0 4px #222) drop-shadow(0 2px 2px #0006)}
.sq>img:not(.chs),.sq>.bpawn{position:relative;z-index:1}
.lk,.cr{position:absolute;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 1px #0008)}
.lk{left:2px;bottom:2px;font-size:calc(var(--sq)*.24)}.cr{left:50%;top:0;transform:translateX(-50%);font-size:calc(var(--sq)*.3)}
.sq.gh img.chs{opacity:.95}
.rl{position:absolute;top:2px;right:3px;font-size:calc(var(--sq)*.26);filter:drop-shadow(0 1px 1px #0008);pointer-events:none}
[hidden]{display:none!important}
#game,#menu,#tut{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#menu{min-height:86vh;justify-content:center;gap:12px;padding:10px 0;text-align:center}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:4px;flex-wrap:wrap;min-height:72px}
.logo{font-size:38px;letter-spacing:.5px}
.tag{margin:0;color:var(--mut)}
.mbtns{display:flex;flex-direction:column;gap:10px;width:min(92vw,360px)}
.big{font:600 18px "Prompt",system-ui,sans-serif;color:#1b2427;background:#f2c84b;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;touch-action:manipulation}
.big.alt{background:var(--btn);color:var(--fg)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mut);font-size:14px}
.chips2,.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chips{display:flex;gap:6px;overflow-x:auto;width:min(96vw,680px);padding-bottom:4px;scrollbar-width:thin}
.chips button{white-space:nowrap;flex:none}
.chips2 button,.tabs button,.chips button,.tnav button:not(.big){font:600 13px "Prompt",system-ui,sans-serif;color:var(--fg);background:var(--btn);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
.chips2 .on,.tabs .on,.chips .on{background:#f2c84b;color:#1b2427}
.foot{color:var(--mut);font-size:13px;margin:4px 0 0}
#tut{padding:10px 0}.ttl{margin:0;font-size:22px}
.tcard{width:min(96vw,680px);box-sizing:border-box;border:1px solid #8884;border-radius:12px;padding:12px 10px}
.tcard h3{margin:0 0 8px;font-size:20px;text-align:center}
.tx{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.5;text-align:left}.tx li{margin-bottom:6px}
.mini{--sq:calc(min(90vw,640px)/10);display:flex;justify-content:center}
.mgrid{display:grid;grid-template-columns:repeat(10,var(--sq));border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px var(--dk)}
.mkx{position:absolute;top:0;right:1px;font-size:calc(var(--sq)*.4);z-index:4;line-height:1;filter:drop-shadow(0 1px 2px #000a)}
.leg{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.tnav{display:flex;align-items:center;gap:12px;justify-content:center;width:min(96vw,680px);color:var(--mut)}
.tnav button:disabled{opacity:.4}
.tnav .big{font-size:16px;padding:10px 22px}
#cf{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;box-sizing:border-box}
.cfc{background:var(--bg);color:var(--fg);border-radius:14px;padding:20px 18px;width:min(92vw,360px);text-align:center;box-shadow:0 10px 40px #000a}
.cfc h3{margin:0 0 8px;font-size:20px}.cfc p{margin:0 0 16px;font-size:15px;line-height:1.45}
.cfb{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="menu" hidden></div>
<div id="tut" hidden></div>
<div id="cf" hidden role="dialog" aria-modal="true"><div class="cfc"><h3>Back to the menu?</h3><p>If you go to the menu, <b>the current game will be reset</b> and your progress will be lost.</p><div class="cfb"><button id="cfk" class="big">▶ Keep playing</button><button id="cfm" class="big alt">☰ Go to menu</button></div></div></div>
<div id="game" hidden>
<h1>Chaos Chess</h1>
<div id="st"></div>
<div class="cp" id="cb"></div>
<div class="wrap"><div id="board"></div><div id="pr" hidden></div><div id="du" hidden></div><img id="hand" alt="" hidden></div>
<div class="cp" id="cw"></div>
<div class="ctl"><button id="hm">☰ Menu</button><button id="ht">📖 Tutorial</button><button id="nw">Restart</button><button id="un">Undo</button><button id="md"></button><button id="tv"></button><button id="sd"></button><button id="nh"></button><button id="bt"></button><button id="cl"></button><button id="fs"></button><button id="lv"></button><button id="mg"></button><button id="mt"></button><button id="bo"></button><button id="ch"></button><button id="sn">Sound: On</button></div>

</div>

{g:0,t:'Goal & Controls',i:'👑',start:1,x:[
 'Win by <b>checkmate</b>: attack the enemy king so it cannot escape. You can also win when the enemy runs out of time ⏱️ (10:00 each) or, in Chaos mode, by delivering the enemy <b>treasure chest 💰</b> to your queen.',
 'Tap a piece, then a highlighted square: a <b>dot</b> is a move, a <b>red ring</b> is a capture. You can also drag &amp; drop.',
 'If your king is attacked you are in <b>check</b> and must fix it. No legal move while in check = checkmate; no legal move otherwise = draw.',
 'The board is <b>10 × 8</b>. White starts at the bottom and moves up.']},
{g:0,t:'Pawn',i:'♟️',pc:'wp',set:[['wp',6,3],['bn',5,4],['bb',5,2],['wp',6,7],['bp',5,7]],x:[
 'Moves <b>1 square forward</b>, or <b>2</b> from its starting row (if both squares are empty).',
 'Captures <b>diagonally forward</b> (red rings). It can never capture straight ahead.',
 '<b>En passant:</b> if an enemy pawn jumps 2 squares and lands beside your pawn, capture it as if it had moved only 1.',
 '<b>Promotion:</b> reaching the far end turns the pawn into a queen, rook, bishop or knight.']},
{g:0,t:'Knight',i:'♞',pc:'wn',set:[['wn',4,4],['bp',2,5],['wp',2,3],['wp',4,5],['bp',3,4],['bb',5,6]],x:[
 'Moves in an <b>L-shape</b>: 2 squares one way, then 1 to the side.',
 'It <b>jumps over</b> any piece. It can land on an empty square or capture an enemy, but not on a friend.']},
{g:0,t:'Bishop',i:'♝',pc:'wb',set:[['wb',5,3],['bp',2,6],['wp',3,1],['bn',6,6]],x:[
 'Slides any distance along <b>diagonals</b>.',
 'It stops before a friendly piece, or captures the first enemy piece in its path. It can never jump.',
 'A bishop always stays on one square colour.']},
{g:0,t:'Rook',i:'♜',pc:'wr',set:[['wr',4,4],['bp',4,8],['wp',1,4],['bn',6,4]],x:[
 'Slides any distance in <b>straight lines</b> (up, down, left, right).',
 'It stops before a friendly piece, or captures the first enemy piece in its path.',
 'Rooks also take part in castling (see King).']},
{g:0,t:'Queen',i:'♛',pc:'wq',set:[['wq',4,4],['bn',4,7],['wp',2,2],['br',6,6],['bp',1,4]],x:[
 'Moves like a <b>rook and a bishop combined</b>: any distance in all 8 directions.',
 'The strongest regular piece. In Chaos mode, a delivered treasure chest wins the game when it reaches <b>your own queen</b>.']},
{g:0,t:'King',i:'♚',pc:'wk',set:[['wk',7,5],['wr',7,1],['wr',7,8],['bk',0,5]],x:[
 'Moves <b>1 square</b> in any direction. It can never move into check.',
 '<b>Castling:</b> if neither the king nor that rook has moved, the squares between are empty and none of the squares the king crosses is attacked, the king moves <b>2 squares</b> toward a rook and the rook jumps to the other side. You cannot castle out of check.',
 'Protect your king: lose it (checkmate) and the game is over.']},
{g:1,t:'Chaos Mode Overview',i:'🐉',start:1,chest:1,x:[
 'Chaos mode adds extra pieces: <b>dragons</b> on the corners and a row of specials in front of the pawns: ghost, monkeys, cannons, skull, shield, plus <b>hooks</b> and a <b>treasure chest 💰</b> on each side.',
 'Special pieces have unique moves, shown in the next pages. Dots and rings in the diagrams are computed by the real game engine.',
 'Prefer standard chess? Pick <b>♟️ Classic</b> as the Chess type in the main menu: 8×8 board with only the regular pieces.']},
{g:1,t:'Dragon',i:'🐉',pc:'wd',set:[['wd',4,4],['bp',4,6],['bn',2,2],['wp',5,5]],x:[
 '<b>Moves:</b> hops 1–2 squares in any direction, jumping over pieces, landing only on empty squares.',
 '<b>Captures by fire 🔥:</b> hits the first enemy within <b>3 squares</b> in any of the 8 directions. The dragon stays where it is.',
 'Fire cannot finish off a shield on its last HP.']},
{g:1,t:'Skull',i:'💀',pc:'ws',set:[['ws',4,4],['bp',3,5],['wp',5,3]],cap:{w:[],b:['wq','wn']},x:[
 '<b>Moves:</b> 1 square in any direction, and it can capture by stepping onto an enemy.',
 '<b>Resurrect ✨:</b> instead of moving, put one of your captured pieces on an empty adjacent square. The skull is then spent and disappears. Kings and skulls cannot be revived; pawns cannot return on the last row.']},
{g:1,t:'Monkey',i:'🐵',pc:'wm',set:[['wm',4,4],['wp',4,5],['bn',3,4],['bk',3,3]],x:[
 '<b>Moves:</b> 1 square in any direction, but it <b>cannot capture by stepping</b>.',
 '<b>Swing:</b> hop over an adjacent piece to the empty square right behind it. Swinging over an <b>enemy captures it</b> 💥 (never the king).',
 '<b>Promotion:</b> reaching the far end it becomes a queen, rook, bishop or knight, or a <b>Big Monkey</b>.']},

function miniBoard(pg){const svW=W,svC=CL;W=10;CL=false;try{return miniBoard0(pg)}finally{W=svW;CL=svC}}
function miniBoard0(pg){
 const sv=CL;CL=false;const s0=newState();CL=sv;
 let b=Array(80).fill(null),main=-1;
 if(pg.start)b=s0.b.slice();else if(pg.set)pg.set.forEach(([k,r,c],n)=>{b[r*W+c]=k;if(n==0)main=r*W+c});
 const mk={},add=(i,e)=>{(mk[i]=mk[i]||new Set()).add(e)};
 if(main>=0){const s=newState();s.b=b;s.cap=pg.cap||{w:[],b:[]};s.cr=null;s.ep=-1;s.t=b[main][0];
  let ms=[];try{ms=pseudo(s,main)}catch(e){}
  for(const m of ms){const p=b[main][1];
   if(m.pull){add(m.t,'🪝');add(m.t,'cap')}
   else if(m.raise){add(m.t,'✨');add(m.t,'mov')}
   else if(m.gh){add(m.t,'👻');add(m.t,'cap');if(m.conv)add(m.t,'🔄')}
   else if(m.fire){add(m.t,p=='c'?'💣':'🔥');add(m.t,'cap')}
   else if(m.jc){add(m.t,'cap');add(m.jmp,'💥')}
   else if(b[m.t]||m.e)add(m.t,'cap');else add(m.t,'mov')}}
 let h='<div class="mini"><div class="mgrid">';
 for(let i=0;i<80;i++){const r=i/W|0,c=i%W,set=mk[i]||new Set();
  const cl='sq '+((r+c)%2?'d':'l')+(i==main?' sel':'')+(set.has('mov')?' mov':'')+(set.has('cap')?' cap':'');
  let badge='';for(const e of set)if(e!='mov'&&e!='cap')badge+=e;
  let ch='';if(pg.chest&&(i==HOME.w||i==HOME.b))ch=`<img class="chs ${i==HOME.w?'w':'b'}" alt="" src="${IM.chest}">`;
  h+=`<div class="${cl}">${ch}${b[i]?pc(b[i]):''}${badge?`<span class="mkx">${badge}</span>`:''}</div>`}
 return h+'</div></div>'}
function showTut(i){
 tutI=Math.max(0,Math.min(TUT.length-1,i));const pg=TUT[tutI];
 $('tbB').classList.toggle('on',pg.g==0);$('tbS').classList.toggle('on',pg.g==1);
 $('tc').innerHTML=TUT.map((q,j)=>q.g==pg.g?`<button data-j="${j}" class="${j==tutI?'on':''}">${q.i} ${q.t}</button>`:'').join('');
 const on=$('tc').querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
 $('tti').textContent=pg.i+'  '+pg.t;
 $('tbd').innerHTML=(pg.set||pg.start?miniBoard(pg)+'<div class="leg">● move · red ring = capture · badges = special action</div>':'')+'<ul class="tx">'+pg.x.map(z=>'<li>'+z+'</li>').join('')+'</ul>';
 $('tn').textContent=(tutI+1)+' / '+TUT.length;
 $('tp').disabled=tutI==0;$('tx').disabled=tutI==TUT.length-1}
function openTut(from,i){tutFrom=from;inGame=false;$('menu').hidden=true;$('game').hidden=true;$('tut').hidden=false;showTut(i||0);window.scrollTo(0,0)}
function closeTut(){$('tut').hidden=true;if(tutFrom=='game'){$('game').hidden=false;inGame=true;lt=Date.now();render()}else showMenu()}
function showMenu(){gen++;busy=false;duel=false;duelId++;$('du').hidden=true;$('hand').hidden=true;inGame=false;$('game').hidden=true;$('tut').hidden=true;$('menu').hidden=false;window.scrollTo(0,0)}
function startGame(mode){bot=mode=='bot';T2=mode=='2v2';CL=RS=='classic';W=CL?8:10;setCl();applyDims();setBo();setTv();$('menu').hidden=true;$('tut').hidden=true;$('game').hidden=false;inGame=true;reset();lt=Date.now();window.scrollTo(0,0)}
function buildMenu(){
 const hero=['wd','wf','wh','wc','wo','ws','wm'].map(k=>`<span style="position:relative;display:inline-flex;align-items:flex-end">${pc(k,'46px')}</span>`).join('');
 $('menu').innerHTML=`<div class="hero">${hero}</div><h1 class="logo">Chaos Chess</h1><p class="tag">Chess with dragons, ghosts, cannons &amp; hooks</p>
 <div class="mbtns"><div class="opt"><span>Chess type</span><div class="chips2" id="mrs"></div></div><button class="big" data-mode="bot">▶ Play vs Bot</button>
 <div class="opt"><span>Bot level</span><div class="chips2" id="mlv"></div></div>
 <div class="opt"><span>You play</span><div class="chips2" id="msd"></div></div>
 <button class="big" data-mode="2p">👥 Local 2 Players</button><button class="big" data-mode="2v2">🤝 Local 2v2</button>
 <button class="big alt" id="mtut">📖 Tutorial</button></div><p class="foot">New here? Open the Tutorial to learn every piece.</p>`;
 const chips=()=>{$('mrs').innerHTML=[['chaos','✨ Special'],['classic','♟️ Classic']].map(([r,n])=>`<button data-rs="${r}" class="${r==RS?'on':''}">${n}</button>`).join('');
  $('mlv').innerHTML=LVN.map((n,j)=>`<button data-lv="${j}" class="${j==LV?'on':''}">${n}</button>`).join('');
  $('msd').innerHTML=[['w','White ⚪'],['b','Black ⚫']].map(([c,n])=>`<button data-sd="${c}" class="${c==ME?'on':''}">${n}</button>`).join('')};
 chips();
 $('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode)startGame(b.dataset.mode);
  else if(b.id=='mtut')openTut('menu',0);
  else if(b.dataset.rs){RS=b.dataset.rs;chips()}
  else if(b.dataset.lv!==undefined){LV=+b.dataset.lv;$('lv').textContent='Level: '+LVN[LV];chips()}
  else if(b.dataset.sd){ME=b.dataset.sd;setSd();chips()}};
 $('tut').innerHTML=`<h2 class="ttl">📖 Tutorial</h2><div class="tabs"><button id="tbB">Basic pieces</button><button id="tbS">Special pieces</button></div>
 <div class="chips" id="tc"></div><div class="tcard"><h3 id="tti"></h3><div id="tbd"></div></div>
 <div class="tnav"><button id="tp">← Prev</button><span id="tn"></span><button id="tx">Next →</button></div>
 <div class="tnav"><button id="tback">← Back</button><button id="tplay" class="big">▶ Play now</button></div>`;
 $('tbB').onclick=()=>showTut(0);$('tbS').onclick=()=>showTut(TUT.findIndex(q=>q.g==1));
 $('tc').onclick=e=>{const b=e.target.closest('button');if(b)showTut(+b.dataset.j)};
 $('tp').onclick=()=>showTut(tutI-1);$('tx').onclick=()=>showTut(tutI+1);
 $('tback').onclick=closeTut;$('tplay').onclick=()=>{if(tutFrom=='game')closeTut();else startGame('bot')}}
$('hm').onclick=()=>{inGame=false;$('cf').hidden=false;$('cfk').focus()};
$('cfk').onclick=()=>{$('cf').hidden=true;inGame=true;lt=Date.now()};
$('cfm').onclick=()=>{$('cf').hidden=true;showMenu()};
$('ht').onclick=()=>openTut('game',0);

Promise.all(Object.keys(IM).map(k=>new Promise(r=>{const i=new Image();i.onload=()=>{NH[k]=i.naturalHeight;r()};i.onerror=r;i.src=IM[k]}))).then(()=>{buildMenu();reset();showMenu()});
</script>
